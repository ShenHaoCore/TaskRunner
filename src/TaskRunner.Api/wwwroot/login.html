<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 — TaskRunner</title>
    <script>
        // 主题初始化须在样式应用前完成，避免闪烁
        document.documentElement.setAttribute(
            "data-theme",
            localStorage.getItem("tr-theme") === "dark" ? "dark" : "light");
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        /* 双主题 token（与首页一致）：
           light = LeptonX Light，dark = Linear */
        :root {
            --radius: 8px;
            --radius-lg: 9px;
        }

        html[data-theme="light"] {
            color-scheme: light;
            --body-bg: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #e8eef3;
            --hover-border: #aebeff;
            --body-color: #325168;
            --body-secondary-color: rgba(50, 81, 104, 0.75);
            --body-tertiary-color: rgba(50, 81, 104, 0.55);
            --primary: #355dff;
            --primary-hover: #2a4ae6;
            --primary-bg-subtle: #d7deff;
            --primary-border-subtle: #aebeff;
            --mark-bg: linear-gradient(120deg, #6c5dd3 0%, #355dff 100%);
            --brand-gradient: linear-gradient(120deg, #6c5dd3 0%, #355dff 100%);
            --chip-bg: #d7deff;
            --chip-ink: #355dff;
            --danger: #c00d49;
            --shadow-sm: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            --shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            --focus-ring: rgba(53, 93, 255, 0.12);
            --foot-bg: #ffffff;
        }

        html[data-theme="dark"] {
            color-scheme: dark;
            --body-bg: #010102;
            --card-bg: #0f1011;
            --border-color: #23252a;
            --hover-border: #34343a;
            --body-color: #f7f8f8;
            --body-secondary-color: #d0d6e0;
            --body-tertiary-color: #8a8f98;
            --primary: #5e6ad2;
            --primary-hover: #828fff;
            --primary-bg-subtle: rgba(94, 106, 210, 0.16);
            --primary-border-subtle: rgba(94, 106, 210, 0.45);
            --mark-bg: #5e6ad2;
            --chip-bg: rgba(94, 106, 210, 0.16);
            --chip-ink: #828fff;
            --danger: #eb5757;
            --shadow-sm: none;
            --shadow: none;
            --focus-ring: rgba(94, 106, 210, 0.25);
            --foot-bg: #010102;
            --radius-lg: 12px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--body-bg);
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--body-bg);
            color: var(--body-color);
            font-family: "Inter", -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        [hidden] {
            display: none !important;
        }

        :focus-visible {
            outline: 2px solid var(--primary-border-subtle);
            outline-offset: 2px;
        }

        .top-strip {
            height: 3px;
            background: var(--brand-gradient, transparent);
        }

        html[data-theme="dark"] .top-strip {
            display: none;
        }

        .container {
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .nav-inner {
            height: 56px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .wordmark {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.2px;
            color: var(--body-color);
            text-decoration: none;
        }

        .wordmark .mark {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: var(--mark-bg);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            box-shadow: var(--shadow-sm);
        }

        .nav-spacer {
            flex: 1;
        }

        .theme-toggle {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--body-secondary-color);
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.15s ease, color 0.15s ease;
        }

            .theme-toggle:hover {
                border-color: var(--hover-border);
                color: var(--primary);
            }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            padding: 32px;
        }

        html[data-theme="dark"] .card {
            border: 1px solid var(--border-color);
        }

        .card .head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .card .head .mark {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            background: var(--mark-bg);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: var(--shadow-sm);
        }

        .card h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .card .sub {
            margin: 0 0 24px;
            font-size: 13px;
            line-height: 1.5;
            color: var(--body-secondary-color);
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        input[type="password"] {
            width: 100%;
            height: 42px;
            padding: 8px 12px;
            font: inherit;
            color: var(--body-color);
            background: var(--body-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            transition: border-color 0.15s ease;
        }

            input[type="password"]:focus {
                outline: none;
                border-color: var(--primary-border-subtle);
                box-shadow: 0 0 0 3px var(--focus-ring);
            }

        .field-hint {
            margin: 8px 0 0;
            font-size: 12px;
            line-height: 1.5;
            color: var(--body-tertiary-color);
        }

            .field-hint code {
                font-size: 11px;
                background: var(--chip-bg);
                border-radius: 4px;
                padding: 1px 5px;
                color: var(--chip-ink);
            }

        .error {
            margin: 12px 0 0;
            font-size: 13px;
            color: var(--danger);
            min-height: 1.4em;
        }

        .btn {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.2;
            padding: 10px 18px;
            border-radius: var(--radius);
            border: 1px solid transparent;
            background: var(--primary);
            color: #fff;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            min-height: 42px;
            transition: background 0.15s ease;
        }

            .btn:hover {
                background: var(--primary-hover);
            }

            .btn[disabled] {
                opacity: 0.65;
                cursor: not-allowed;
            }

        .foot {
            border-top: 1px solid var(--border-color);
            background: var(--foot-bg);
            padding: 16px 0;
            font-size: 12px;
            color: var(--body-tertiary-color);
            text-align: center;
        }

            .foot a {
                color: var(--body-secondary-color);
            }

                .foot a:hover {
                    color: var(--primary);
                }
    </style>
</head>
<body>
    <div class="top-strip"></div>
    <header>
        <div class="container nav-inner">
            <a class="wordmark" href="/"><span class="mark">▸</span>TaskRunner</a>
            <span class="nav-spacer"></span>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换亮暗主题">☾</button>
        </div>
    </header>

    <main>
        <form class="card" id="login-form">
            <div class="head">
                <span class="mark">▸</span>
                <h1>管理员登录</h1>
            </div>
            <p class="sub">登录后写入管理员 Cookie，Dashboard 与运维接口在本浏览器内免弹窗访问。</p>
            <label for="api-key">管理员密钥</label>
            <input type="password" id="api-key" name="apiKey" autocomplete="current-password" autofocus required />
            <p class="field-hint">即生产配置 <code>Hangfire:AdminApiKey</code>（服务器上位于 <code>/etc/default/taskrunner</code>）。</p>
            <p class="error" id="error" aria-live="polite"></p>
            <button class="btn" type="submit" id="submit">登录并打开 Dashboard</button>
        </form>
    </main>

    <footer class="foot">
        <a href="/">← 返回首页</a>
    </footer>

    <script>
        (function () {
            const toggle = document.getElementById("theme-toggle");
            const syncIcon = () => {
                toggle.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "☀" : "☾";
            };
            toggle.addEventListener("click", () => {
                const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
                document.documentElement.setAttribute("data-theme", next);
                localStorage.setItem("tr-theme", next);
                syncIcon();
            });
            syncIcon();
        })();

        (function () {
            const form = document.getElementById("login-form");
            const input = document.getElementById("api-key");
            const button = document.getElementById("submit");
            const error = document.getElementById("error");

            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                const apiKey = input.value.trim();
                if (!apiKey) {
                    error.textContent = "请输入管理员密钥。";
                    return;
                }
                button.disabled = true;
                button.textContent = "登录中…";
                error.textContent = "";
                try {
                    const res = await fetch("/api/auth/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ apiKey })
                    });
                    if (res.ok) {
                        location.href = "/taskrunner";
                        return;
                    }
                    error.textContent = res.status === 401 ? "密钥无效，请核对后重试。" : "登录失败（HTTP " + res.status + "）。";
                } catch (err) {
                    error.textContent = "网络错误：" + (err.message || "未知异常");
                } finally {
                    button.disabled = false;
                    button.textContent = "登录并打开 Dashboard";
                }
            });
        })();
    </script>
</body>
</html>
