<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>任务运行台 — TaskRunner</title>
    <script>
        document.documentElement.setAttribute(
            "data-theme",
            localStorage.getItem("tr-theme") === "dark" ? "dark" : "light");
    </script>
    <style>
        /* 与 Hangfire Dashboard 同款（Bootstrap 3.3 + hangfire.css）：
           light = Hangfire 经典（navbar #222 / 链接 #337ab7 / 成功 #5cb85c）
           dark  = Hangfire 1.8 官方暗色（#22272e 画布 + #2d333b 浮层 + #4d4d4d 边线） */
        :root { --radius: 4px; }

        html[data-theme="light"] {
            color-scheme: light;
            --body-bg: #fff; --text: #333; --text-secondary: #777; --text-muted: #999;
            --border: #ddd; --border-light: #eee;
            --link: #337ab7; --link-hover: #23527c;
            --navbar-bg: #222; --navbar-border: #080808;
            --navbar-ink: #9d9d9d; --navbar-ink-hover: #fff; --navbar-active-bg: #080808;
            --sidebar-bg: #f8f8f8; --sidebar-border: #e7e7e7; --sidebar-ink: #777;
            --sidebar-active-bg: #e7e7e7; --sidebar-active-ink: #555;
            --btn-bg: #fff; --btn-border: #ccc; --btn-ink: #333;
            --btn-hover-bg: #e6e6e6; --btn-hover-border: #adadad;
            --input-bg: #fff; --input-ink: #555; --input-border: #ccc;
            --input-focus-border: #66afe9; --input-focus-ring: rgba(102, 175, 233, 0.6);
            --row-hover: #f9f9f9; --well-bg: #f5f5f5;
            --success: #5cb85c; --success-border: #4cae4c;
            --danger: #d9534f; --danger-border: #d43f3a;
            --warning: #f0ad4e; --info: #5bc0de; --metric-default: #777;
            --alert-danger-bg: #f2dede; --alert-danger-border: #ebccd1; --alert-danger-ink: #a94442;
            --alert-success-bg: #dff0d8; --alert-success-border: #d6e9c6; --alert-success-ink: #3c763d;
            --footer-bg: #f5f5f5; --code-bg: #f9f2f4; --code-ink: #c7254e;
        }

        html[data-theme="dark"] {
            color-scheme: dark;
            --body-bg: #22272e; --text: #adbac7; --text-secondary: rgba(255, 255, 255, 0.6); --text-muted: rgba(255, 255, 255, 0.45);
            --border: #4d4d4d; --border-light: #4d4d4d;
            --link: #539bf5; --link-hover: #539bf5;
            --navbar-bg: #2d333b; --navbar-border: transparent;
            --navbar-ink: rgba(255, 255, 255, 0.6); --navbar-ink-hover: #fff; --navbar-active-bg: #373e47;
            --sidebar-bg: transparent; --sidebar-border: #4d4d4d; --sidebar-ink: rgba(255, 255, 255, 0.6);
            --sidebar-active-bg: #373e47; --sidebar-active-ink: #fff;
            --btn-bg: #2d333b; --btn-border: #4d4d4d; --btn-ink: rgba(255, 255, 255, 0.9);
            --btn-hover-bg: #373e47; --btn-hover-border: #4d4d4d;
            --input-bg: #22272e; --input-ink: #adbac7; --input-border: #4d4d4d;
            --input-focus-border: #539bf5; --input-focus-ring: rgba(83, 155, 245, 0.35);
            --row-hover: #2d333b; --well-bg: #2d333b;
            --success: #5cb85c; --success-border: #5cb85c;
            --danger: #d9534f; --danger-border: #d9534f;
            --warning: #f0ad4e; --info: #5bc0de; --metric-default: #777;
            --alert-danger-bg: rgba(215, 58, 74, 0.1); --alert-danger-border: rgba(235, 156, 166, 0.3); --alert-danger-ink: rgb(235, 156, 166);
            --alert-success-bg: rgba(87, 171, 90, 0.1); --alert-success-border: rgba(87, 171, 90, 0.4); --alert-success-ink: rgb(87, 171, 90);
            --footer-bg: #2d333b; --code-bg: #2d333b; --code-ink: #f97583;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0; padding-top: 75px;
            background: var(--body-bg); color: var(--text);
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            font-size: 14px; line-height: 1.42857143;
        }

        a { color: var(--link); text-decoration: none; }
        a:hover { color: var(--link-hover); text-decoration: underline; }
        [hidden] { display: none !important; }

        code {
            padding: 2px 4px; font-size: 90%; color: var(--code-ink);
            background-color: var(--code-bg); border-radius: var(--radius);
            font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
        }

        /* 布局骨架：固定顶栏 + 左侧 #stats 侧栏 + 右侧内容 + 灰底页脚 */
        .container { padding-left: 25px; padding-right: 25px; }
        .row { margin-left: -15px; margin-right: -15px; }
        .col-md-3, .col-md-9 { position: relative; min-height: 1px; padding-left: 15px; padding-right: 15px; }
        @media (min-width: 992px) {
            .col-md-3, .col-md-9 { float: left; }
            #wrap > .container > .row > .col-md-3 { width: 251px; }
            #wrap > .container > .row > .col-md-9 { width: calc(100% - 251px); }
        }
        @media (min-width: 1200px) {
            #wrap > .container > .row > .col-md-3 { width: 293px; }
            #wrap > .container > .row > .col-md-9 { width: calc(100% - 293px); }
        }
        .row:before, .row:after, .container:before, .container:after { content: " "; display: table; }
        .row:after, .container:after { clear: both; }

        #wrap { min-height: 100%; height: auto; margin: 0 auto -60px; padding: 0 0 60px; }
        #footer { background-color: var(--footer-bg); }
        .credit { margin: 20px 0; word-break: break-word; color: var(--text-secondary); }

        /* 顶栏 */
        .navbar { min-height: 50px; border: 1px solid transparent; }
        .navbar-fixed-top { position: fixed; top: 0; left: 0; right: 0; z-index: 1030; border-width: 0 0 1px; }
        .navbar-inverse { background-color: var(--navbar-bg); border-color: var(--navbar-border); }
        .navbar .container { display: flex; align-items: center; }
        .navbar-header { flex: none; }
        .navbar-brand {
            display: block; height: 50px; padding: 15px; font-size: 18px; line-height: 20px;
            color: var(--navbar-ink);
        }
        .navbar-brand:hover { color: var(--navbar-ink-hover); text-decoration: none; }
        .navbar-nav { display: flex; margin: 0 0 0 auto; padding: 0; }
        .navbar-nav > li { list-style: none; }
        .navbar-nav > li > a { padding: 15px; line-height: 20px; color: var(--navbar-ink); display: block; }
        .navbar-nav > li > a:hover { color: var(--navbar-ink-hover); text-decoration: none; }
        .navbar-nav > li.active > a { color: var(--navbar-ink-hover); background-color: var(--navbar-active-bg); }
        .theme-toggle {
            flex: none; height: 34px; margin: 8px 0 8px 8px; padding: 5px 10px;
            background: transparent; border: 1px solid var(--navbar-border);
            border-radius: var(--radius); color: var(--navbar-ink);
            font-size: 12px; cursor: pointer; font-family: inherit;
        }
        .theme-toggle:hover { color: var(--navbar-ink-hover); }
        @media (max-width: 767px) { .navbar-nav { display: none; } }

        /* 标题与侧栏 */
        .page-header { padding-bottom: 9px; margin: 20px 0 10px; border-bottom: 1px solid var(--border-light); }
        .page-header h1 {
            margin: 0; font-size: 36px; font-weight: 500; overflow: hidden;
            white-space: nowrap; text-overflow: ellipsis;
        }
        .page-header h1 small { font-size: 65%; font-weight: 400; color: var(--text-secondary); line-height: 1; }

        .list-group { margin-bottom: 20px; padding-left: 0; }
        .list-group-item {
            position: relative; display: block; padding: 10px 15px; margin-bottom: -1px;
            background-color: var(--sidebar-bg); border: 1px solid var(--sidebar-border);
        }
        .list-group-item:first-child { border-top-left-radius: var(--radius); border-top-right-radius: var(--radius); }
        .list-group-item:last-child { margin-bottom: 0; border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius); }
        a.list-group-item { color: var(--sidebar-ink); }
        a.list-group-item:hover, a.list-group-item:focus { color: var(--text); text-decoration: none; background-color: var(--sidebar-bg); }
        a.list-group-item.active { color: var(--sidebar-active-ink); background-color: var(--sidebar-active-bg); border-color: var(--sidebar-border); }
        a.list-group-item .glyphicon { margin-right: 3px; }
        .list-group-item .text-muted { float: right; }
        @media (min-width: 992px) { #stats { position: fixed; width: 220px; } }
        @media (min-width: 1200px) { #stats { width: 262.5px; } }

        /* Bootstrap 3 表格 */
        .table { width: 100%; margin-bottom: 20px; border-collapse: collapse; }
        .table > thead > tr > th,
        .table > tbody > tr > td {
            padding: 8px; line-height: 1.42857143; vertical-align: top;
            border-top: 1px solid var(--border); text-align: left;
        }
        .table > thead > tr > th { vertical-align: bottom; border-bottom: 2px solid var(--border); border-top: 0; }
        .table > tbody > tr:hover > td { background-color: var(--row-hover); }
        .table td.align-right { text-align: right; }

        /* 按钮 */
        .btn {
            display: inline-block; padding: 6px 12px; font-size: 14px; font-weight: 400;
            line-height: 1.42857143; text-align: center; white-space: nowrap; vertical-align: middle;
            cursor: pointer; user-select: none; border: 1px solid transparent; border-radius: var(--radius);
            font-family: inherit; text-decoration: none;
        }
        .btn:hover { text-decoration: none; }
        .btn-default { color: var(--btn-ink); background-color: var(--btn-bg); border-color: var(--btn-border); }
        .btn-default:hover { background-color: var(--btn-hover-bg); border-color: var(--btn-hover-border); }
        .btn-success { color: #fff; background-color: var(--success); border-color: var(--success-border); }
        .btn-success:hover { color: #fff; filter: brightness(0.92); }
        .btn-sm { padding: 5px 10px; font-size: 12px; line-height: 1.5; border-radius: 3px; }
        .btn[disabled] { opacity: 0.65; cursor: not-allowed; }

        /* 表单 */
        .form-control {
            display: block; width: 100%; padding: 6px 12px; font-size: 14px; line-height: 1.42857143;
            color: var(--input-ink); background-color: var(--input-bg);
            border: 1px solid var(--input-border); border-radius: var(--radius);
            box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.075); font-family: inherit;
        }
        .form-control:focus {
            border-color: var(--input-focus-border); outline: 0;
            box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.075), 0 0 8px var(--input-focus-ring);
        }
        .form-control::placeholder { color: var(--text-muted); }

        /* 提示条（alert）与状态标签（label） */
        .alert { padding: 15px; margin-bottom: 20px; border: 1px solid transparent; border-radius: var(--radius); }
        .alert-danger { color: var(--alert-danger-ink); background-color: var(--alert-danger-bg); border-color: var(--alert-danger-border); }
        .alert-success { color: var(--alert-success-ink); background-color: var(--alert-success-bg); border-color: var(--alert-success-border); }

        .label {
            display: inline; padding: 0.2em 0.6em 0.3em; font-size: 75%; font-weight: 700;
            line-height: 1; color: #fff; text-align: center; white-space: nowrap;
            vertical-align: baseline; border-radius: 0.25em;
        }
        .label-success { background-color: var(--success); }
        .label-default { background-color: var(--metric-default); }

        .well {
            min-height: 20px; padding: 19px; margin-bottom: 20px;
            background-color: var(--well-bg); border: 1px solid var(--border);
            border-radius: var(--radius); color: var(--text-secondary); text-align: center;
        }

        .text-muted { color: var(--text-muted); }
        .word-break { word-break: break-all; }
        .btn-toolbar-top { margin-bottom: 10px; }
        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
        .toolbar .form-control { display: inline-block; width: auto; min-width: 240px; flex: 1 1 240px; max-width: 340px; }

        .hide-sm { display: table-cell; }
        @media (max-width: 640px) { .hide-sm { display: none; } }
    </style>
</head>
<body>
    <div id="wrap">
        <div class="navbar navbar-inverse navbar-fixed-top">
            <div class="container">
                <div class="navbar-header">
                    <a class="navbar-brand" href="/">TaskRunner</a>
                </div>
                <ul class="nav navbar-nav navbar-right">
                    <li><a href="/taskrunner">Hangfire Dashboard</a></li>
                    <li><a href="/api/tasks">任务 API</a></li>
                    <li><a href="/login.html">登录</a></li>
                </ul>
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换亮暗主题">☾ 主题</button>
            </div>
        </div>

        <div class="container">
            <div class="row">
                <div class="col-md-3">
                    <div class="block" id="stats">
                        <div class="list-group">
                            <a class="list-group-item" href="/">仪表盘</a>
                            <a class="list-group-item" href="/taskrunner">Hangfire Dashboard</a>
                            <a class="list-group-item active" href="/run.html">任务运行台</a>
                            <a class="list-group-item" href="/api/tasks">任务 API</a>
                            <a class="list-group-item" href="/login.html">管理员登录</a>
                            <a class="list-group-item" href="/info">/info</a>
                            <a class="list-group-item" href="/health">/health</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-9">
                    <div class="page-header">
                        <h1>任务运行台 <small>按名称过滤已注册任务，一键立即运行，需管理员登录会话</small></h1>
                    </div>

                    <div class="alert" id="banner" role="status" hidden></div>

                    <div class="btn-toolbar-top toolbar">
                        <input id="filter" class="form-control" type="search" placeholder="过滤 JobId / 显示名…" autocomplete="off" />
                        <button class="btn btn-default" type="button" id="reload">刷新</button>
                    </div>

                    <table class="table">
                        <thead>
                            <tr>
                                <th>任务</th>
                                <th class="hide-sm">队列</th>
                                <th>状态</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="rows"></tbody>
                    </table>
                    <div class="well" id="empty" hidden>没有匹配的任务。</div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer">
        <div class="container">
            <div class="credit">
                <a href="/">← 返回首页</a> · <a href="/login.html">登录</a> · TaskRunner 运行台 · 基于 Hangfire
            </div>
        </div>
    </div>

    <script>
        (function () {
            const toggle = document.getElementById("theme-toggle");
            const syncIcon = () => {
                toggle.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "☀ 主题" : "☾ 主题";
            };
            toggle.addEventListener("click", () => {
                const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
                document.documentElement.setAttribute("data-theme", next);
                localStorage.setItem("tr-theme", next);
                syncIcon();
            });
            syncIcon();
        })();

        (function () {
            const rowsEl = document.getElementById("rows");
            const emptyEl = document.getElementById("empty");
            const filterEl = document.getElementById("filter");
            const banner = document.getElementById("banner");
            let tasks = [];

            function showBanner(text, kind) {
                banner.textContent = text;
                banner.className = "alert " + (kind === "error" ? "alert-danger" : "alert-success");
                banner.hidden = false;
            }

            function clearBanner() {
                banner.className = "alert";
                banner.textContent = "";
                banner.hidden = true;
            }

            function render() {
                const q = filterEl.value.trim().toLowerCase();
                const filtered = tasks.filter((t) => {
                    if (!q) return true;
                    return (t.jobId || "").toLowerCase().includes(q)
                        || (t.jobName || "").toLowerCase().includes(q);
                });
                rowsEl.innerHTML = "";
                emptyEl.hidden = filtered.length > 0;
                for (const t of filtered) {
                    const tr = document.createElement("tr");
                    tr.innerHTML =
                        "<td><strong>" + escapeHtml(t.jobName || t.jobId) + "</strong>"
                        + "<div class=\"text-muted word-break\"><small>" + escapeHtml(t.jobId) + "</small></div></td>"
                        + "<td class=\"hide-sm text-muted\">" + escapeHtml(t.queue || "default") + "</td>"
                        + "<td><span class=\"label " + (t.isEnabled ? "label-success" : "label-default") + "\">"
                        + (t.isEnabled ? "启用" : "停用") + "</span></td>"
                        + "<td class=\"align-right\"></td>";
                    const btn = document.createElement("button");
                    btn.className = "btn btn-success btn-sm";
                    btn.type = "button";
                    btn.textContent = "立即运行";
                    btn.addEventListener("click", () => trigger(t.jobId, btn));
                    tr.lastElementChild.appendChild(btn);
                    rowsEl.appendChild(tr);
                }
            }

            function escapeHtml(value) {
                return String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            async function load() {
                clearBanner();
                const res = await fetch("/api/tasks", { credentials: "same-origin" });
                if (res.status === 401) {
                    showBanner("需要管理员登录后才能查看任务。", "error");
                    tasks = [];
                    render();
                    return;
                }
                if (!res.ok) {
                    showBanner("加载失败（HTTP " + res.status + "）。", "error");
                    return;
                }
                tasks = await res.json();
                render();
            }

            async function trigger(jobId, button) {
                button.disabled = true;
                clearBanner();
                try {
                    const res = await fetch("/api/tasks/" + encodeURIComponent(jobId) + "/trigger", {
                        method: "POST",
                        credentials: "same-origin"
                    });
                    if (res.status === 401) {
                        showBanner("会话已失效，请重新登录。", "error");
                        return;
                    }
                    const body = await res.json().catch(() => ({}));
                    if (!res.ok) {
                        showBanner(body.message || ("触发失败（HTTP " + res.status + "）"), "error");
                        return;
                    }
                    showBanner("已入队 " + jobId + " → " + (body.queueJobId || ""), "ok");
                } catch (err) {
                    showBanner("网络错误：" + (err.message || "未知异常"), "error");
                } finally {
                    button.disabled = false;
                }
            }

            filterEl.addEventListener("input", render);
            document.getElementById("reload").addEventListener("click", load);
            load();
        })();
    </script>
</body>
</html>
