<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>运行台 — TaskRunner</title>
    <script>
        document.documentElement.setAttribute(
            "data-theme",
            localStorage.getItem("tr-theme") === "dark" ? "dark" : "light");
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        :root { --radius: 8px; --radius-lg: 9px; }
        html[data-theme="light"] {
            color-scheme: light;
            --body-bg: #f8f9fa; --card-bg: #ffffff; --border-color: #e8eef3;
            --body-color: #325168; --body-secondary-color: rgba(50, 81, 104, 0.75);
            --body-tertiary-color: rgba(50, 81, 104, 0.55);
            --primary: #355dff; --primary-hover: #2a4ae6; --danger: #c00d49;
            --ok: #0d7a3f; --chip-bg: #d7deff; --chip-ink: #355dff;
            --mark-bg: linear-gradient(120deg, #6c5dd3 0%, #355dff 100%);
            --focus-ring: rgba(53, 93, 255, 0.12); --foot-bg: #ffffff;
            --row-hover: #f3f6fb;
        }
        html[data-theme="dark"] {
            color-scheme: dark;
            --body-bg: #010102; --card-bg: #0f1011; --border-color: #23252a;
            --body-color: #f7f8f8; --body-secondary-color: #d0d6e0;
            --body-tertiary-color: #8a8f98;
            --primary: #5e6ad2; --primary-hover: #828fff; --danger: #eb5757;
            --ok: #3dd68c; --chip-bg: rgba(94, 106, 210, 0.16); --chip-ink: #828fff;
            --mark-bg: #5e6ad2; --focus-ring: rgba(94, 106, 210, 0.25);
            --foot-bg: #010102; --row-hover: #16171a; --radius-lg: 12px;
        }
        * { box-sizing: border-box; }
        html { background: var(--body-bg); }
        body {
            margin: 0; min-height: 100vh; display: flex; flex-direction: column;
            font-family: Inter, "Noto Sans SC", system-ui, sans-serif;
            color: var(--body-color); background: var(--body-bg);
        }
        a { color: var(--primary); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .top-strip { height: 3px; background: var(--mark-bg); }
        .container { width: min(960px, calc(100% - 32px)); margin: 0 auto; }
        header { border-bottom: 1px solid var(--border-color); background: var(--card-bg); }
        .nav-inner { display: flex; align-items: center; gap: 12px; height: 56px; }
        .wordmark { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--body-color); text-decoration: none; }
        .mark {
            display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center;
            border-radius: 6px; background: var(--mark-bg); color: #fff; font-size: 12px;
        }
        .nav-spacer { flex: 1; }
        .theme-toggle, .btn {
            border: 1px solid var(--border-color); background: var(--card-bg); color: var(--body-color);
            border-radius: var(--radius); cursor: pointer; font: inherit;
        }
        .theme-toggle { width: 36px; height: 36px; }
        .btn {
            padding: 6px 12px; background: var(--primary); color: #fff; border-color: transparent;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-ghost { background: transparent; color: var(--body-color); border-color: var(--border-color); }
        main { flex: 1; padding: 28px 0 48px; }
        h1 { margin: 0 0 6px; font-size: 1.5rem; }
        .sub { margin: 0 0 18px; color: var(--body-secondary-color); font-size: 0.95rem; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: center; }
        .toolbar input {
            flex: 1; min-width: 200px; padding: 10px 12px; border-radius: var(--radius);
            border: 1px solid var(--border-color); background: var(--card-bg); color: var(--body-color);
            font: inherit;
        }
        .toolbar input:focus { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); border-color: var(--primary); }
        .banner {
            display: none; margin-bottom: 14px; padding: 12px 14px; border-radius: var(--radius);
            border: 1px solid var(--border-color); background: var(--card-bg); color: var(--body-secondary-color);
        }
        .banner.show { display: block; }
        .banner.error { color: var(--danger); }
        .banner.ok { color: var(--ok); }
        .panel {
            border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            background: var(--card-bg); overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
        th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        th { color: var(--body-tertiary-color); font-weight: 600; font-size: 0.8rem; letter-spacing: 0.02em; }
        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: var(--row-hover); }
        .muted { color: var(--body-tertiary-color); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.85rem; }
        .chip {
            display: inline-block; padding: 2px 8px; border-radius: 999px;
            background: var(--chip-bg); color: var(--chip-ink); font-size: 0.75rem; font-weight: 600;
        }
        .chip.off { opacity: 0.55; }
        .empty { padding: 28px 14px; text-align: center; color: var(--body-tertiary-color); }
        .foot {
            border-top: 1px solid var(--border-color); background: var(--foot-bg);
            padding: 16px 0; font-size: 12px; color: var(--body-tertiary-color); text-align: center;
        }
        @media (max-width: 640px) {
            .hide-sm { display: none; }
        }
    </style>
</head>
<body>
    <div class="top-strip"></div>
    <header>
        <div class="container nav-inner">
            <a class="wordmark" href="/"><span class="mark">▸</span>TaskRunner</a>
            <span class="nav-spacer"></span>
            <a class="btn btn-ghost" href="/taskrunner">Dashboard</a>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换亮暗主题">☾</button>
        </div>
    </header>

    <main>
        <div class="container">
            <h1>任务运行台</h1>
            <p class="sub">按名称过滤已注册任务，一键立即运行。需管理员登录会话。</p>
            <div class="banner" id="banner" role="status"></div>
            <div class="toolbar">
                <input id="filter" type="search" placeholder="过滤 JobId / 显示名…" autocomplete="off" />
                <button class="btn btn-ghost" type="button" id="reload">刷新</button>
            </div>
            <div class="panel">
                <table>
                    <thead>
                        <tr>
                            <th>任务</th>
                            <th class="hide-sm">队列</th>
                            <th>状态</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
                <div class="empty" id="empty" hidden>没有匹配的任务。</div>
            </div>
        </div>
    </main>

    <footer class="foot">
        <a href="/">← 返回首页</a>
        ·
        <a href="/login.html">登录</a>
    </footer>

    <script>
        (function () {
            const toggle = document.getElementById("theme-toggle");
            const syncIcon = () => {
                toggle.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "☀" : "☾";
            };
            toggle.addEventListener("click", () => {
                const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
                document.documentElement.setAttribute("data-theme", next);
                localStorage.setItem("tr-theme", next);
                syncIcon();
            });
            syncIcon();
        })();

        (function () {
            const rowsEl = document.getElementById("rows");
            const emptyEl = document.getElementById("empty");
            const filterEl = document.getElementById("filter");
            const banner = document.getElementById("banner");
            let tasks = [];

            function showBanner(text, kind) {
                banner.textContent = text;
                banner.className = "banner show" + (kind ? " " + kind : "");
            }

            function clearBanner() {
                banner.className = "banner";
                banner.textContent = "";
            }

            function render() {
                const q = filterEl.value.trim().toLowerCase();
                const filtered = tasks.filter((t) => {
                    if (!q) return true;
                    return (t.jobId || "").toLowerCase().includes(q)
                        || (t.jobName || "").toLowerCase().includes(q);
                });
                rowsEl.innerHTML = "";
                emptyEl.hidden = filtered.length > 0;
                for (const t of filtered) {
                    const tr = document.createElement("tr");
                    tr.innerHTML =
                        "<td><div>" + escapeHtml(t.jobName || t.jobId) + "</div>"
                        + "<div class=\"muted\">" + escapeHtml(t.jobId) + "</div></td>"
                        + "<td class=\"hide-sm muted\">" + escapeHtml(t.queue || "default") + "</td>"
                        + "<td><span class=\"chip" + (t.isEnabled ? "" : " off") + "\">"
                        + (t.isEnabled ? "启用" : "停用") + "</span></td>"
                        + "<td style=\"text-align:right\"></td>";
                    const btn = document.createElement("button");
                    btn.className = "btn";
                    btn.type = "button";
                    btn.textContent = "立即运行";
                    btn.addEventListener("click", () => trigger(t.jobId, btn));
                    tr.lastElementChild.appendChild(btn);
                    rowsEl.appendChild(tr);
                }
            }

            function escapeHtml(value) {
                return String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            async function load() {
                clearBanner();
                const res = await fetch("/api/tasks", { credentials: "same-origin" });
                if (res.status === 401) {
                    showBanner("需要管理员登录后才能查看任务。", "error");
                    tasks = [];
                    render();
                    return;
                }
                if (!res.ok) {
                    showBanner("加载失败（HTTP " + res.status + "）。", "error");
                    return;
                }
                tasks = await res.json();
                render();
            }

            async function trigger(jobId, button) {
                button.disabled = true;
                clearBanner();
                try {
                    const res = await fetch("/api/tasks/" + encodeURIComponent(jobId) + "/trigger", {
                        method: "POST",
                        credentials: "same-origin"
                    });
                    if (res.status === 401) {
                        showBanner("会话已失效，请重新登录。", "error");
                        return;
                    }
                    const body = await res.json().catch(() => ({}));
                    if (!res.ok) {
                        showBanner(body.message || ("触发失败（HTTP " + res.status + "）"), "error");
                        return;
                    }
                    showBanner("已入队 " + jobId + " → " + (body.queueJobId || ""), "ok");
                } catch (err) {
                    showBanner("网络错误：" + (err.message || "未知异常"), "error");
                } finally {
                    button.disabled = false;
                }
            }

            filterEl.addEventListener("input", render);
            document.getElementById("reload").addEventListener("click", load);
            load();
        })();
    </script>
</body>
</html>
