name: .NET CICD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { project: TaskRunner.Api, rid: win-x64 }
          - { project: TaskRunner.Api, rid: linux-x64 }
          - { project: TaskRunner.Worker, rid: win-x64 }
          - { project: TaskRunner.Worker, rid: linux-x64 }

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Publish ${{ matrix.project }} (${{ matrix.rid }})
        run: >-
          dotnet publish src/${{ matrix.project }}/${{ matrix.project }}.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -o publish/${{ matrix.project }}-${{ matrix.rid }}

      - name: Package
        working-directory: publish
        run: zip -r ${{ matrix.project }}-${{ matrix.rid }}.zip ${{ matrix.project }}-${{ matrix.rid }}

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" "publish/${{ matrix.project }}-${{ matrix.rid }}.zip" --clobber

      # 从 CHANGELOG 提取对应版本的「升级到本版本要做什么」，置于 Release 说明顶部
      # （其后保留 --generate-notes 的自动内容）。仅由 Api/linux-x64 矩阵位执行一次。
      - name: Attach upgrade notes
        if: matrix.project == 'TaskRunner.Api' && matrix.rid == 'linux-x64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ ("^## " ver "( |$)") {p=1; next}
            /^## / && p {exit}
            p {print}
          ' CHANGELOG.md > upgrade-notes.md
          gh release view "$GITHUB_REF_NAME" --json body -q .body > auto-notes.md 2>/dev/null || true
          { cat upgrade-notes.md; echo; echo "---"; echo; cat auto-notes.md; } > release-body.md
          gh release edit "$GITHUB_REF_NAME" --notes-file release-body.md
